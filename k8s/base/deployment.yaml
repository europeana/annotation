apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotation-api-deployment
spec:
  # selector.matchLabels is provided via Kustomize
  #selector:
  #  matchLabels:
  #    app: annotation-api
  template:
    spec:
      containers:
      - name: annotation-api
        image: europeana/annotation-api
        env:
          - name: SPRING_CONFIG_NAME
            value: "application,annotation,annotation.user"
          - name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "/opt/app/config/annotation.user.properties"
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: app-properties
            mountPath: "/opt/app/config/annotation.user.properties"
            readOnly: true
            subPath: annotation.user.properties
          - name: log4j-config
            mountPath: "/opt/app/config/log4j2-spring.xml"
            readOnly: true
            subPath: log4j2-spring.xml   
      volumes:
        - name: app-properties
          secret:
            secretName: annotation-api-properties
        - name: log4j-config
          configMap:
            name: log4j2-properties    
