resources:
  - deployment.yaml

labels:
  - includeSelectors: true
    pairs:
      app: annotation-api

# expects files to be in the same directory
secretGenerator:
  - name: annotation-api-properties
    files:
      - annotation.user.properties
      
#generate config mapping for log4j2.xml file
configMapGenerator:
  - name: log4j2-properties
    files:
      - log4j2-spring.xml      